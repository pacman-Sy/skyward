name: Build begonia

# The Redmi Note 8 Pro is not one of the devices the upstream build lists,
# and its stock build is a dump of the recovery partition rather than an
# update package with a payload. This workflow builds that one image, on
# every push to this branch or when run by hand.
on:
  push:
    branches: ["begonia"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  tools:
    name: Build the recovery service and the packer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the recovery service for the phone
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward
      # It runs as a second system's first program, before any library is
      # there to load.
      - name: Build the second system's first program, static
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward-system-init --target-dir target/system-init
      - name: Build the packer
        run: cargo build --locked --release -p skyward-pack
      - name: Gather them
        run: |
          mkdir tools
          cp target/aarch64-linux-android/release/skyward target/release/skyward-pack tools/
          cp target/system-init/aarch64-linux-android/release/system-init tools/
      - uses: actions/upload-artifact@v7
        with:
          name: tools
          path: tools/
          if-no-files-found: error
          retention-days: 1

  recovery:
    name: Recovery for begonia
    needs: tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tools
          path: tools
      - name: Make the tools runnable
        run: chmod +x tools/skyward tools/skyward-pack
      # The dump keeps the whole 64 MiB recovery partition, AVB footer and
      # all, and the configuration names its SHA-256.
      - name: Take the stock recovery image
        run: tools/skyward-pack stock --config devices/begonia.toml --out stock/recovery.img
      - name: Pack the recovery
        id: pack
        run: |
          stock=$(tools/skyward-pack stock --config devices/begonia.toml | sed -n 's/^version=//p')
          name="skyward-${GITHUB_SHA::7}-begonia-${stock}"
          mkdir out
          tools/skyward-pack recovery --stock stock/recovery.img --binary tools/skyward --system-init tools/system-init \
            --config devices/begonia.toml --font resources/fonts/MiSansVF.ttf --mono resources/fonts/KirkMono-Regular.ttf \
            --mono-license resources/fonts/KirkMono-OFL.txt --out "out/$name.img"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Zip the image
        working-directory: out
        env:
          NAME: ${{ steps.pack.outputs.name }}
        run: zip -9 "$NAME.zip" "$NAME.img"
      - uses: actions/upload-artifact@v7
        with:
          path: out/${{ steps.pack.outputs.name }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 7
